<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="A practice table in three depths: the back of the table stays still under a slow change of north light, one new line is drawn across the middle sheet in a single pass and rests complete, and a water drop falls into the ink stone at the lower edge and ripples once">
<rect x="0" y="0" width="1200" height="300" fill="#f3ebd7"/>
<g>
<rect x="880" y="30" width="250" height="58" fill="#e8dec6"/>
<rect x="884" y="34" width="242" height="50" fill="#efe7d2"/>
<polygon points="1010,18 1086,18 1096,40 1020,40" fill="#68645e"/>
<rect x="0" y="0" width="1200" height="110" fill="#fffaf0" opacity="0">
<animate attributeName="opacity" values="0;0.4;0" dur="24s" repeatCount="indefinite"/>
</rect>
</g>
<g stroke="#1c1a17" stroke-linecap="round">
<line x1="90" y1="70" x2="400" y2="70" stroke-width="8"/>
<line x1="470" y1="70" x2="760" y2="70" stroke-width="7"/>
<line x1="90" y1="112" x2="380" y2="112" stroke-width="6"/>
<line x1="470" y1="112" x2="700" y2="112" stroke-width="6" stroke-dasharray="200 400"/>
</g>
<g>
<path d="M120 196 L700 188" stroke="#1c1a17" stroke-width="13" stroke-linecap="round" fill="none" stroke-dasharray="600" stroke-dashoffset="600">
<animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.38;0.8;1" dur="20s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;1;0.25;0" keyTimes="0;0.62;0.85;1" dur="20s" repeatCount="indefinite"/>
</path>
</g>
<g>
<rect x="470" y="238" width="200" height="52" rx="10" fill="#22201e"/>
<ellipse cx="570" cy="264" rx="70" ry="15" fill="#100f0e"/>
<ellipse cx="570" cy="264" rx="10" ry="3.4" fill="none" stroke="#8f8c80" stroke-width="2" opacity="0">
<animate attributeName="rx" values="6;58" dur="5s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="ry" values="1.6;12" dur="5s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.85;0" dur="5s" begin="2s" repeatCount="indefinite"/>
</ellipse>
<circle cx="570" cy="150" r="5" fill="#3a4048" opacity="0">
<animate attributeName="cy" values="150;258" dur="5s" begin="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.82;0.9" dur="5s" begin="2s" repeatCount="indefinite"/>
</circle>
</g>
</svg>
